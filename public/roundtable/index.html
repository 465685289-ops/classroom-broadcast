<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>思想圆桌 · 七人谈</title>
<style>
  :root {
    --bg: #f3eadc;
    --panel: rgba(252,247,238,.72);
    --msg-other: rgba(255,255,255,.78);
    --msg-user: linear-gradient(135deg,#9a6f2e,#7c5722);
    --text: #352c20;
    --text-muted: #7c6f5b;
    --border: rgba(120,90,40,.16);
    --input-bg: rgba(255,255,255,.62);
    --accent: #9a6f2e;
    --glass: saturate(150%) blur(20px);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height: 100%; }
  body {
    color: var(--text);
    font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    height: 100dvh; display: flex; overflow: hidden;
    background:
      radial-gradient(60% 50% at 12% -5%, rgba(154,111,46,.12), transparent 60%),
      radial-gradient(50% 45% at 105% 15%, rgba(176,124,64,.10), transparent 60%),
      radial-gradient(55% 55% at 85% 110%, rgba(120,90,40,.08), transparent 60%),
      #f3eadc;
  }

  /* ── 左侧人物面板 ── */
  .sidebar {
    width: 240px; min-width: 240px;
    background: var(--panel); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 18px 12px;
    overflow-y: auto;
  }
  .sidebar h2 {
    font-size: 12px; letter-spacing: 3px; color: var(--text-muted);
    text-align: center; margin: 4px 0 16px; font-weight: 600;
  }
  .char-card {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; cursor: pointer; transition: .2s ease;
    border: 0; width: 100%; text-align: left; font: inherit; color: inherit;
    border-radius: 14px; margin: 3px 0; opacity: .55; background: transparent;
  }
  .char-card:hover { background: rgba(120,90,40,.06); opacity: .85; }
  .char-card.selected { opacity: 1; background: rgba(120,90,40,.08); }
  .char-card .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600; color: #fff; flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(90,70,40,.22), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .char-card .name { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  .char-card .sub  { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* ── 主聊天区 ── */
  .main {
    flex:1; display:flex; flex-direction:column; min-width:0;
  }

  .header {
    padding: 16px 26px; border-bottom: 1px solid var(--border);
    font-size: 15px; letter-spacing: .5px; color: var(--text); font-weight: 600;
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.5); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass);
  }
  .header .dot { width:8px; height:8px; border-radius:50%; background:#30d158; box-shadow:0 0 10px #30d158; }
  .header .count { font-size:12px; color: var(--text-muted); margin-left: auto; font-weight: 400; }

  .messages {
    flex:1; overflow-y: auto; padding: 24px 26px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .messages::-webkit-scrollbar { width: 7px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(120,90,40,.2); border-radius: 4px; }
  .messages::-webkit-scrollbar-thumb:hover { background: rgba(120,90,40,.3); }

  /* ── 消息气泡 ── */
  .msg {
    display: flex; gap: 12px; max-width: 80%; animation: fadeIn .35s ease;
  }
  .msg.user-msg { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar-sm {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: #fff; flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(90,70,40,.22), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .msg .bubble {
    padding: 13px 17px; border-radius: 20px; line-height: 1.72;
    font-size: 15px; position: relative; border: 1px solid var(--border);
    background: var(--msg-other); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass);
    box-shadow: 0 8px 24px rgba(90,70,40,.1);
  }
  .msg.user-msg .bubble { background: var(--msg-user); border: none; border-bottom-right-radius: 6px; color:#fff; box-shadow: 0 8px 22px rgba(154,111,46,.3); }
  .msg:not(.user-msg) .bubble { border-bottom-left-radius: 6px; }
  .msg .sender {
    font-size: 12px; font-weight: 700; margin-bottom: 5px; letter-spacing: .3px;
  }
  .msg .bubble p { margin: 5px 0; text-align: justify; }
  .msg .bubble p:first-child { margin-top: 0; }
  .msg .bubble p:last-child { margin-bottom: 0; }

  /* @mention in reply */
  .bubble .at-mention {
    color: #b5651d; font-weight: 700; cursor: pointer;
  }

  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-8px); } }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  /* ── @ 选择区 ── */
  .at-bar {
    padding: 12px 26px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    border-top: 1px solid var(--border); background: rgba(255,255,255,.5);
    -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass);
  }
  .at-bar .label {
    font-size: 13px; color: var(--text-muted); letter-spacing: 1px; white-space: nowrap; font-weight: 600;
  }
  .at-chip {
    padding: 6px 14px; border-radius: 18px; font-size: 13px;
    border: 1px solid var(--border); cursor: pointer; transition: .18s ease;
    background: rgba(255,255,255,.55); color: var(--text-muted); white-space: nowrap; font-family: inherit;
  }
  .at-chip:hover { background: rgba(120,90,40,.07); color: var(--text); transform: translateY(-1px); }
  .at-chip.active { color: var(--text); background: rgba(154,111,46,.16); box-shadow: 0 2px 10px rgba(90,70,40,.14); }
  .at-chip.all-chip { font-weight: 700; }
  .at-chip.all-chip.active { color:#fff; background: var(--accent); border-color: transparent; box-shadow: 0 4px 14px rgba(154,111,46,.4); }

  /* ── 输入区 ── */
  .input-area {
    padding: 14px 26px 18px;
    display: flex; gap: 12px; align-items: center;
  }
  .input-area input {
    flex:1; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 18px; font-size: 15px;
    color: var(--text); outline: none; font-family: inherit; transition: .18s;
    -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass);
  }
  .input-area input::placeholder { color: var(--text-muted); }
  .input-area input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(154,111,46,.22); }
  .input-area button {
    background: linear-gradient(135deg,#9a6f2e,#7c5722); border: none; color: #fff;
    padding: 14px 26px; border-radius: 14px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: .18s; white-space: nowrap; letter-spacing: 1px;
    box-shadow: 0 6px 18px rgba(154,111,46,.4);
  }
  .input-area button:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(154,111,46,.5); }
  .input-area button:active { transform: translateY(0); }
  .input-area button:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ── API Key ── */
  .key-panel {
    padding: 12px 26px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.5);
  }
  .key-panel input {
    flex:1; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 14px; font-size: 13px;
    color: var(--text); outline: none; font-family: ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .key-panel input:focus { border-color: var(--accent); }
  .key-panel label { font-size: 12px; color: var(--text-muted); white-space: nowrap; font-weight: 600; }
  .key-panel button {
    background: rgba(120,90,40,.1); border: 1px solid var(--border); color: #fff; padding: 8px 16px;
    border-radius: 10px; font-size: 13px; cursor: pointer; transition: .15s;
  }
  .key-panel button:hover { background: rgba(120,90,40,.14); }

  /* ── 消息间引用区块 ── */
  .quote-block {
    border-left: 3px solid rgba(120,90,40,.25);
    padding: 6px 12px; margin: 8px 0; font-size: 13px;
    color: var(--text-muted); font-style: italic; background: rgba(255,255,255,.5);
    border-radius: 0 4px 4px 0;
  }
  .quote-block .qt-author { font-style: normal; font-weight: 700; color: #8a7c64; }

  /* ═══════ 移动端适配 ═══════ */
  @media (max-width: 768px) {
    body { flex-direction: column; }

    /* 侧边栏 → 顶部可折叠面板 */
    .sidebar {
      width: 100%; min-width: 100%; max-height: 56px; overflow: hidden;
      flex-direction: row; align-items: center; padding: 8px 12px;
      border-right: none; border-bottom: 1px solid var(--border);
      transition: max-height .3s;
    }
    .sidebar.open { max-height: 400px; overflow-y: auto; flex-direction: column; align-items: stretch; }
    .sidebar h2 { display: none; }
    .sidebar .toggle-btn {
      display: flex; align-items: center; gap: 6px; font-size: 13px;
      color: var(--text-muted); cursor: pointer; letter-spacing: 2px;
      padding: 4px 0; white-space: nowrap; border:0; background:transparent; font-family:inherit;
    }
    .sidebar.open .toggle-btn { margin-bottom: 8px; }
    /* 折叠时只露出 toggle 按钮，不让人物卡片挤成一行 */
    .sidebar:not(.open) .char-card { display: none; }
    .char-card { padding: 8px 10px; border-left: none; border-radius: 8px; margin: 2px 0; }
    .char-card.selected { background: rgba(120,90,40,.06); }
    .char-card .avatar { width: 30px; height: 30px; font-size: 13px; }
    .char-card .name { font-size: 14px; }
    .char-card .sub { font-size: 10px; }

    /* 主聊天区占满 */
    .main { flex: 1; min-height: 0; }
    .header { padding: 10px 14px; font-size: 14px; }
    .messages { padding: 12px 14px; gap: 10px; }

    /* 消息气泡全宽 */
    .msg { max-width: 95%; }
    .msg .bubble { font-size: 14px; padding: 10px 14px; }
    .msg .avatar-sm { width: 28px; height: 28px; font-size: 11px; }

    /* @ 选择栏横向滚动 */
    .at-bar { padding: 8px 12px; gap: 6px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
    .at-bar .label { font-size: 11px; }
    .at-chip { padding: 4px 10px; font-size: 12px; border-radius: 14px; flex-shrink: 0; }

    /* 输入区 */
    .key-panel { padding: 8px 14px; flex-wrap: wrap; }
    .key-panel input { font-size: 12px; padding: 6px 10px; }
    .input-area { padding: 8px 14px 12px; gap: 8px; }
    .input-area input { font-size: 14px; padding: 10px 14px; }
    .input-area button { padding: 10px 18px; font-size: 14px; }

    .sys-msg { font-size: 11px; }
  }

  /* 系统消息 */
  .sys-msg {
    text-align: center; font-size: 12px; color: var(--text-muted);
    padding: 4px 0; letter-spacing: 1px;
  }

  /* @mention mark tag */
  .bubble .tag { display: inline-block; background: rgba(120,90,40,.06); padding: 1px 6px; border-radius: 3px; font-size: 12px; margin: 0 2px; }

  /* ── 头部余额 / 用户 ── */
  .balance-pill {
    font-size: 13px; color: var(--text); background: rgba(120,90,40,.08);
    border: 1px solid var(--border); border-radius: 14px; padding: 4px 12px; cursor: pointer; white-space: nowrap; font-family:inherit;
  }
  .balance-pill b { color: #30d158; }
  .balance-pill:hover { background: rgba(120,90,40,.2); }
  .hdr-user { font-size: 12px; color: var(--text-muted); white-space: nowrap; cursor: pointer; border:0; background:transparent; font-family:inherit; }
  .hdr-user:hover { color: var(--accent); }

  /* ── 登录 / 购买 浮层 ── */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(53,44,32,.42); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .modal {
    position: relative; width: 100%; max-width: 380px; background: rgba(252,247,238,.96);
    -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass);
    border: 1px solid var(--border); border-radius: 22px; padding: 28px 24px;
    box-shadow: 0 24px 70px rgba(90,70,40,.22); animation: fadeIn .25s ease;
  }
  .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 4px; letter-spacing: .5px; }
  .modal .modal-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }
  .modal .field { margin-bottom: 12px; }
  .modal input {
    width: 100%; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px 15px; font-size: 15px; color: var(--text);
    outline: none; font-family: inherit; transition: .18s;
  }
  .modal input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(154,111,46,.22); }
  .modal .code-row { display: flex; gap: 8px; }
  .modal .code-row input { flex: 1; min-width: 0; }
  .modal .code-row button { width: auto; white-space: nowrap; margin-top: 0; padding: 0 12px; box-shadow: none; }
  .modal .btn-primary {
    width: 100%; background: linear-gradient(135deg,#9a6f2e,#7c5722); border: none; color: #fff;
    padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
    margin-top: 6px; box-shadow: 0 6px 18px rgba(154,111,46,.4); transition: .18s;
  }
  .modal .btn-primary:hover { transform: translateY(-1px); }
  .modal .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .modal .switch-line { text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 14px; }
  .modal .switch-line a { color: var(--accent); cursor: pointer; }
  .modal .err { color: #ff453a; font-size: 13px; min-height: 18px; margin: 2px 0 8px; }
  .modal .close-x { position: absolute; top: 14px; right: 18px; color: var(--text-muted); cursor: pointer; font-size: 22px; line-height: 1; }
  button.close-x { border:0; background:transparent; font-family:inherit; }
  .link-button { border:0; padding:0; background:transparent; color:var(--accent); font:inherit; cursor:pointer; text-decoration:underline; }
  .sr-only { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
  .buy-pkg {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    cursor: pointer; transition: .18s; background: rgba(255,255,255,.5); width:100%; color:inherit; font-family:inherit; text-align:left;
  }
  .buy-pkg:hover { border-color: var(--accent); background: rgba(154,111,46,.1); }
  .buy-pkg .pk-name { font-size: 15px; font-weight: 600; }
  .buy-pkg .pk-price { font-size: 18px; font-weight: 700; color: #b5651d; }
</style>
</head>

// 账号：复用与作文批改等工具通用的 broadcast_token

let rtBalance = 0;
let pointCost = 50;

let currentGenId = null; // 当前话题 id（由后端 /start 返回）

updateAtUI();

// ═══════ 账号 / 配置 ═══════
function authHeaders(json) {
  const h = {};
  if (json) h['Content-Type'] = 'application/json';
  if (authToken) h['x-token'] = authToken; // 与作文批改等工具一致：用 x-token 头
  return h;
}

async function bootstrap() {
  if (!authToken) { hideAuth(); return; }
  try {
    const r = await fetch('/api/roundtable/config', { headers: authHeaders() });
    if (r.status === 401) { clearToken(); showAuth(); return; }
    rtConfig = await r.json();
    rtBalance = rtConfig.balance || 0;
    pointCost = Number(rtConfig.point_cost) || 50;
    hideAuth();
    renderAccountUI();
    handlePayReturn();
    if (pendingSend) {
      pendingSend = false;
      sendMessage();
    }
  } catch (e) {
    showAuth();
  }
}

function clearToken() { authToken = ''; localStorage.removeItem('broadcast_token'); }

function renderAccountUI() {
  document.getElementById('rt-balance-n').textContent = rtBalance;
  document.getElementById('rt-balance').style.display = '';
  document.getElementById('rt-user').textContent = ((rtConfig && (rtConfig.display_name || rtConfig.username)) || '') + ' · 退出';
}

function showAuth() { document.getElementById('authOverlay').classList.add('show'); }
function hideAuth() { document.getElementById('authOverlay').classList.remove('show'); }

function toggleAuthMode() {
  authMode = authMode === 'login' ? 'register' : 'login';
  const isReg = authMode === 'register';
  document.getElementById('authTitle').textContent = isReg ? '注册思想圆桌' : '登录思想圆桌';
  document.getElementById('authBtn').textContent = isReg ? '注 册' : '登 录';
  document.getElementById('authUserField').style.display = isReg ? 'none' : '';
  document.getElementById('authNameField').style.display = isReg ? '' : 'none';
  document.getElementById('authEmailField').style.display = isReg ? '' : 'none';
  document.getElementById('authCodeField').style.display = isReg ? '' : 'none';
  document.getElementById('authSwitch').innerHTML = isReg
    ? '已有账号？<button type="button" class="link-button" onclick="toggleAuthMode()">去登录</button>'
    : '还没有账号？<button type="button" class="link-button" onclick="toggleAuthMode()">注册一个</button>';
  document.getElementById('authErr').textContent = '';
}

async function sendRegisterCode() {
  const email = document.getElementById('authEmail').value.trim();
  const err = document.getElementById('authErr');
  const btn = document.getElementById('sendAuthCodeBtn');
  err.textContent = '';
  if (!email) { err.textContent = '请填写邮箱'; return; }
  btn.disabled = true;
  btn.textContent = '发送中…';
  try {
    const r = await fetch('/api/register/send-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await r.json();
    err.textContent = data.message || data.error || (r.ok ? '验证码已发送，请查看邮箱' : '验证码发送失败');
  } catch (e) {
    err.textContent = '网络错误，请重试';
  } finally {
    btn.disabled = false;
    btn.textContent = '获取验证码';
  }
}

async function submitAuth() {
  const username = document.getElementById('authUser').value.trim();
  const displayName = document.getElementById('authName').value.trim();
  const password = document.getElementById('authPass').value;
  const err = document.getElementById('authErr');
  const btn = document.getElementById('authBtn');
  err.textContent = '';
  const isReg = authMode === 'register';
  if (!password || (!isReg && !username) || (isReg && !displayName)) { err.textContent = isReg ? '请填写称呼和密码' : '请输入邮箱（或旧用户名）和密码'; return; }
  const body = isReg ? { password, display_name: displayName } : { username, password };
  if (isReg) {
    const email = document.getElementById('authEmail').value.trim();
    const code = document.getElementById('authCode').value.trim();
    if (!email || !code) { err.textContent = '请填写邮箱和验证码'; return; }
    body.email = email;
    body.code = code;
  }
  btn.disabled = true;
  try {
    const r = await fetch(isReg ? '/api/register' : '/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    const data = await r.json();
    if (!r.ok) { err.textContent = data.error || '操作失败'; btn.disabled = false; return; }
    authToken = data.token;
    localStorage.setItem('broadcast_token', authToken);
    btn.disabled = false;
    await bootstrap();
  } catch (e) {
    err.textContent = '网络错误，请重试'; btn.disabled = false;
  }
}

function logout() {
  if (!confirm('退出登录？')) return;
  clearToken();
  location.reload();
}

  try {
    const r = await fetch('/api/roundtable/payments/package', {
      method: 'POST', headers: authHeaders(true), body: JSON.stringify({ package_key: key })
    });
    const data = await r.json();
    if (!r.ok) { err.textContent = data.error || '创建订单失败'; return; }
    err.textContent = '正在跳转到微信支付，付款后自动回到本页…';
    window.location.href = data.pay_url;
  } catch (e) { err.textContent = '网络错误，请重试'; }
}

// 支付返回（return_url 带 ?pay_order=）后确认结果
async function handlePayReturn() {
  const oid = new URLSearchParams(location.search).get('pay_order');
  if (!oid) return;
  history.replaceState(null, '', location.pathname);
  addSysMsg('⏳ 正在确认支付结果…');
  let tries = 0;
  const timer = setInterval(async () => {
    tries++;
    try {
      const r = await fetch('/api/payments/' + encodeURIComponent(oid), { headers: authHeaders() });
      if (r.ok) {
        const d = await r.json();
        if (d && d.status === 'paid') {
          clearInterval(timer);
          await refreshBalance();
          addSysMsg('✅ 充值成功，当前余额 ' + rtBalance + ' 积分');
          return;
        }
      }
    } catch (e) {}
    if (tries > 20) { clearInterval(timer); addSysMsg('支付结果确认超时，如已付款请刷新页面查看余额'); }
  }, 3000);
}

async function refreshBalance() {
  try {
    const r = await fetch('/api/roundtable/config', { headers: authHeaders() });
    if (r.ok) { rtConfig = await r.json(); rtBalance = rtConfig.balance || 0; pointCost = Number(rtConfig.point_cost) || 50; renderAccountUI(); }
  } catch (e) {}
}

async function submitRedeem() {
  const code = document.getElementById('redeemCode').value.trim();
  const err = document.getElementById('buyErr');
  if (!code) { err.textContent = '请输入兑换码'; return; }
  err.textContent = '兑换中…';
  try {
    const r = await fetch('/api/roundtable/redeem', {
      method: 'POST', headers: authHeaders(true), body: JSON.stringify({ code })
    });
    const data = await r.json();
    if (!r.ok) { err.textContent = data.error || '兑换失败'; return; }
    rtBalance = data.balance; renderAccountUI();
    document.getElementById('buy-balance').textContent = rtBalance;
    err.textContent = '✅ 兑换成功，+' + (data.points || data.credits * pointCost) + ' 积分';
    document.getElementById('redeemCode').value = '';
  } catch (e) { err.textContent = '网络错误，请重试'; }
}

// ═══════ @ 选择逻辑 ═══════
function toggleAt(chip, target) {
  if (target === 'all') {
    // 点"所有人"：清空其他，只留all
    atTargets = new Set(['all']);
  } else {
    // 点个人：取消all，切换个人
    atTargets.delete('all');
    if (atTargets.has(target)) {
      atTargets.delete(target);
      // 全删完了回到all
      if (atTargets.size === 0) atTargets.add('all');
    } else {
      atTargets.add(target);
    }
  }
  updateAtUI();
}

function updateAtUI() {
  document.querySelectorAll('.at-chip').forEach(chip => {
    const at = chip.dataset.at;
    if (at === 'all') {
      chip.classList.toggle('active', atTargets.has('all'));
    } else {
      chip.classList.toggle('active', atTargets.has(at));
    }
  });
  // 更新侧边栏选中状态
  document.querySelectorAll('.char-card').forEach(card => {
    const id = card.dataset.id;
    card.classList.toggle('selected', atTargets.has('all') || atTargets.has(id));
  });
}

function getSelectedChars() {
  if (atTargets.has('all')) return Object.keys(CHARACTERS);
  return [...atTargets].filter(id => CHARACTERS[id]);
}

function getAtLabel() {
  if (atTargets.has('all')) return '@所有人';
  const names = [...atTargets].map(id => CHARACTERS[id]?.name).filter(Boolean);
  return '@' + names.join(' · @');
}

// ═══════ 核心逻辑 ═══════
async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isProcessing) return;

  if (!authToken) { pendingSend = true; showAuth(); return; }

  const selected = getSelectedChars();
  const atLabel = getAtLabel();

  isProcessing = true;
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  // 开一个新话题：后端扣除本话题所需师行积分
  let genId;
  try {
    const r = await fetch('/api/roundtable/start', {
      method: 'POST', headers: authHeaders(true),
      body: JSON.stringify({ topic: text, at_targets: atLabel })
    });
    if (r.status === 401) { clearToken(); showAuth(); isProcessing = false; sendBtn.disabled = false; return; }
    const data = await r.json();
    if (r.status === 402) { isProcessing = false; sendBtn.disabled = false; openBuy(); document.getElementById('buyErr').textContent = data.error || '师行积分不足'; return; }
    if (!r.ok) { alert(data.error || '发送失败'); isProcessing = false; sendBtn.disabled = false; return; }
    genId = data.generation_id;
    currentGenId = genId;
    rtBalance = data.balance;
    renderAccountUI();
  } catch (e) {
    alert('网络错误，请重试'); isProcessing = false; sendBtn.disabled = false; return;
  }

  input.value = '';
  roundCount++;
  addSysMsg(`📣 第 ${roundCount} 轮 · ${atLabel}`);
  addMessage('user', '你', formatReply(text), '#5a7da8');
  transcript.push({ role: 'user', id: 'user', name: '你', color: '#5a7da8', text });

  // 第一轮：选中的人依次发言（每人都能看到此前的完整实录）
  const roundMsgs = [];
  for (const id of selected) {
    const entry = await speak(id);
    if (entry) roundMsgs.push(entry);
  }

  // 追加轮：被 @ 的人（包括已发言的）登场互怼
  await runDebate(selected, roundMsgs);

  // 保存完整实录到后台
  try {
    await fetch('/api/roundtable/finish', {
      method: 'POST', headers: authHeaders(true),
      body: JSON.stringify({
        generation_id: genId,
        transcript: transcript.map(m => ({ role: m.role, name: m.name, text: m.text }))
      })
    });
  } catch (e) {}

  isProcessing = false;
  sendBtn.disabled = false;
  updateCount();
}

// 让某个人物发言：读取完整实录 → 流式输出 → 写回实录
async function speak(id, hint) {
  const char = CHARACTERS[id];
  const placeholder = addMessage(
    id, char.name + (hint ? ' ⤷' : ''),
    '<div class="typing"><span></span><span></span><span></span></div>',
    char.color, true
  );
  const bubble = placeholder.querySelector('.bubble');
  const messages = [
    { role: 'system', content: char.prompt + (hint ? '\n\n注意：群里有人 @ 了你或针对了你的观点，你需要回应——反驳、追问或展开都行。' : '') },
    { role: 'user', content: buildContext(id, hint) }
  ];

  try {
    const reply = await streamChat(messages, { temperature: hint ? 0.9 : 0.85, max_tokens: 800 }, (full) => {
      bubble.innerHTML = formatReply(full);
      scrollToBottom();
    });
    const finalText = reply.trim() || '（沉默）';
    if (!reply.trim()) bubble.innerHTML = formatReply(finalText);
    const entry = { role: 'char', id, name: char.name, color: char.color, text: finalText };
    transcript.push(entry);
    return entry;
  } catch (e) {
    bubble.innerHTML = `<span style="color:#e74c3c">${e.message || '发言失败'}</span>`;
    return null;
  }
}

// 构建喂给模型的上下文：整场讨论实录 + 本轮指令
function buildContext(id, hint) {
  const char = CHARACTERS[id];
  let log = transcript.map(m => `${m.name}：${m.text}`).join('\n\n');
  if (log.length > MAX_CONTEXT_CHARS) {
    log = '……（更早的发言略）\n\n' + log.slice(-MAX_CONTEXT_CHARS);
  }
  let instr = `这是一场跨时空圆桌讨论。以下是到目前为止的完整实录：\n\n${log}\n\n`;
  if (hint) {
    instr += `${hint}\n现在轮到你（${char.name}）回应。结合上面的实录，针对点你名或反驳你的人开火，被你针对的人请用「@某人」点名。直接说话，不要以"作为XX"开头。100-250字。`;
  } else {
    instr += `现在轮到你（${char.name}）发言。结合上面的实录提出你的看法；如果想反驳或回应某个人，用「@某人」的格式点名。直接说话，不要以"作为XX"开头。200-350字。`;
  }
  return instr;
}

// @互怼：扫描上一批发言里的 @mention，触发被点名的人（含已发言者）再次开口
async function runDebate(selected, prevMsgs) {
  let batch = prevMsgs;
  for (let r = 0; r < MAX_DEBATE_ROUNDS; r++) {
    const targets = collectMentions(batch).filter(tid => selected.includes(tid));
    if (targets.length === 0) break;

    addSysMsg('💬 有人被 @ 了，追加交锋……');
    const newBatch = [];
    for (const id of targets) {
      const entry = await speak(id, '群里有人在上面的发言中 @ 了你或针对了你。');
      if (entry) newBatch.push(entry);
    }
    batch = newBatch;
  }
}

// 从一批发言中收集被 @ 的人（排除自己 @ 自己）
function collectMentions(msgs) {
  const nameToId = {};
  for (const [id, c] of Object.entries(CHARACTERS)) nameToId[c.name] = id;
  const targets = new Set();
  for (const m of msgs) {
    const re = /@(马克思|王阳明|庄子|福柯|巴菲特|鲁迅|教育研究者|所有人)/g;
    let mm;
    while ((mm = re.exec(m.text)) !== null) {
      if (mm[1] === '所有人') {
        for (const id of Object.keys(CHARACTERS)) if (id !== m.id) targets.add(id);
      } else {
        const tid = nameToId[mm[1]];
        if (tid && tid !== m.id) targets.add(tid);
      }
    }
  }
  return [...targets];
}

// ═══════ 流式请求（走自己的后端，key 在服务端，永不下发）═══════
async function streamChat(messages, opts, onChunk) {
  const resp = await fetch('/api/roundtable/speak', {
    method: 'POST',
    headers: authHeaders(true),
    body: JSON.stringify({
      generation_id: currentGenId,
      messages,
      temperature: opts.temperature,
      max_tokens: opts.max_tokens
    })
  });

  if (!resp.ok) {
    let detail = '';
    try { const j = await resp.json(); detail = j.error || ''; } catch (e) {}
    if (resp.status === 401) { clearToken(); showAuth(); }
    throw new Error(detail || apiErrMsg(resp.status));
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '', full = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 1);
      if (!line.startsWith('data:')) continue;
      const payload = line.slice(5).trim();
      if (payload === '[DONE]') continue;
      let j;
      try { j = JSON.parse(payload); } catch (e) { continue; /* 不完整分片 */ }
      if (j.error) throw new Error(j.error); // 后端透传的错误
      const delta = j.choices?.[0]?.delta?.content || '';
      if (delta) { full += delta; onChunk(full); }
    }
  }
  return full;
}

function apiErrMsg(status) {
  if (status === 401) return '登录已过期，请重新登录。';
  if (status === 402) return '师行积分不足，请充值后再试。';
  if (status === 429) return '本话题发言太频繁，请开一个新话题。';
  if (status >= 500) return `服务暂时出错（${status}），稍后重试。`;
  return `请求失败（${status}）`;
}

function scrollToBottom() {
  const c = document.getElementById('messages');
  c.scrollTop = c.scrollHeight;
}

function addMessage(senderId, senderName, content, color, isPlaceholder) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg' + (senderId === 'user' ? ' user-msg' : '');
  div.innerHTML = `
    <div class="avatar-sm" style="background:${color}">${senderName[0]}</div>
    <div>
      <div class="sender" style="color:${color}">${senderName}</div>
      <div class="bubble">${content}</div>
    </div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function addSysMsg(text) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'sys-msg';
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function formatReply(text) {
  // 先转义 HTML，防止模型输出的尖括号破坏页面
  text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // 加粗 **xxx**
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // 高亮 @mention
  text = text.replace(/@(马克思|王阳明|庄子|福柯|巴菲特|鲁迅|教育研究者|所有人)/g, '<span class="at-mention">@$1</span>');
  // 按行分段
  return text.split('\n').map(line => line.trim() ? `<p>${line}</p>` : '').join('');
}

function updateCount() {
  const count = document.querySelectorAll('.msg').length;
  document.getElementById('msg-count').textContent = count + ' 条消息';
}

// 侧边栏点击快速切换@
document.querySelectorAll('.char-card').forEach(card => {
  card.addEventListener('click', () => {
    const id = card.dataset.id;
    const chip = document.querySelector(`.at-chip[data-at="${id}"]`);
    if (chip) toggleAt(chip, id);
  });
});
