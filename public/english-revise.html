<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="师行英语作文学生返修页面"><title>英语作文返修 · 师行</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3eee5;color:#203244;font:15px/1.75 "PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:30px 18px 70px}.head,.card{background:#fffdf8;border:1px solid #ded5c8;border-radius:18px;box-shadow:0 14px 45px rgba(31,50,68,.1)}.head{padding:24px 28px;margin-bottom:16px}.head h1,h2{font-family:"Songti SC","STSong",serif;color:#183c57;margin:0}.meta{color:#71808a;margin-top:7px}.card{padding:22px;margin-bottom:15px}.task,.draft{white-space:pre-wrap}.task{background:#edf3f1;padding:14px;border-radius:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.draft{min-height:210px;padding:15px;border:1px solid #ded5c8;border-radius:11px;background:#fff;font:15px/1.9 Georgia,"Times New Roman",serif}.note{padding:11px 13px;border-left:4px solid #2c705e;background:#edf5f1;border-radius:8px;margin:9px 0}.suggest{font-family:Georgia,"Times New Roman",serif;color:#2c705e}textarea{width:100%;min-height:310px;border:2px solid #cfc5b6;border-radius:12px;padding:15px;font:16px/1.9 Georgia,"Times New Roman",serif}button{display:block;margin:15px auto 0;border:0;border-radius:10px;padding:13px 30px;background:#183c57;color:#fff;font-weight:700}.status{text-align:center;padding:35px;color:#71808a}.success{padding:12px;background:#e3f3ea;color:#205a49;border-radius:9px;text-align:center;margin-top:12px}@media(max-width:680px){.wrap{padding:15px 11px 45px}.head,.card{padding:17px}.grid{grid-template-columns:1fr}.draft{min-height:150px}}</style></head>
<body><main class="wrap"><section class="head"><h1>英语作文返修</h1><div class="meta" id="meta">正在打开老师发来的批改结果…</div></section><div class="card status" id="loading">正在加载…</div><div id="content" hidden><section class="card"><h2>写作任务</h2><div class="task" id="task"></div></section><section class="card"><h2>教师定稿反馈</h2><div id="feedback"></div></section><section class="card"><h2>原稿与最近一稿</h2><div class="grid"><div><h3>原稿</h3><div class="draft" id="original"></div></div><div><h3>最近一稿</h3><div class="draft" id="latest"></div></div></div></section><section class="card"><h2>提交修改稿</h2><p>根据老师最终保留的批注修改全文。提交后，老师会在英语工作台看到“已返修”。</p><textarea id="revision" placeholder="Paste your revised writing here..."></textarea><button id="submit">提交修改稿</button><div id="message"></div></section></div></main>
<script>(function(){var token=location.pathname.split('/').filter(Boolean).pop(),data=null;function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}async function load(){try{var response=await fetch('/api/english/public/'+encodeURIComponent(token)),d=await response.json();if(!response.ok)throw new Error(d.error||'链接无效');data=d;document.getElementById('meta').textContent=(d.student&&d.student.name?d.student.name+' · ':'')+d.assignment.title;document.getElementById('task').textContent='题目：'+d.assignment.title+'\n题型：'+d.assignment.genre+'\n要求：'+(d.assignment.requirements||'按老师要求完成')+'\n词数：'+(d.assignment.min_words||0)+'—'+(d.assignment.max_words||0);var revisions=d.revisions||[];document.getElementById('original').textContent=revisions[0]?revisions[0].essay_text:'';document.getElementById('latest').textContent=revisions.length>1?revisions[revisions.length-1].essay_text:'尚未提交修改稿';var review=d.review||{},html='';if(review.score_override)html+='<p><b>教师定稿分数：</b>'+esc(review.score_override)+'</p>';if(review.summary_override)html+='<div class="note">'+esc(review.summary_override)+'</div>';(review.annotations||[]).filter(function(a){return a.status!=='deleted'}).forEach(function(a){html+='<div class="note"><b>'+esc(a.category||'批注')+'：</b>'+esc(a.quote||'')+'<br>'+esc(a.explanation_zh||a.comment||'')+(a.suggestion_en?'<div class="suggest">建议：'+esc(a.suggestion_en)+'</div>':'')+'</div>'});document.getElementById('feedback').innerHTML=html||'<p>老师尚未完成定稿，请稍后再打开。</p>';document.getElementById('loading').hidden=true;document.getElementById('content').hidden=false}catch(e){document.getElementById('loading').textContent=e.message}}document.getElementById('submit').addEventListener('click',async function(){var text=document.getElementById('revision').value.trim(),msg=document.getElementById('message');if(text.length<30){msg.textContent='请填写完整的英语修改稿';return}this.disabled=true;try{var response=await fetch('/api/english/public/'+encodeURIComponent(token)+'/revisions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({essay_text:text})}),d=await response.json();if(!response.ok)throw new Error(d.error||'提交失败');msg.className='success';msg.textContent='修改稿已提交，老师可以进行二次批改。';document.getElementById('latest').textContent=text}catch(e){msg.textContent=e.message}finally{this.disabled=false}});load()})();</script></body></html>
